version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text_summarizer_backend
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: text_summarizer_frontend
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
